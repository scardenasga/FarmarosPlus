<div class="dialog-overlay" (click)="cancel()">
  <div class="dialog-container" (click)="$event.stopPropagation()">
    <h2 class="dialog-title">{{ title() }}</h2>
    <p class="dialog-content">
      {{ content() }}
    </p>
    <div class="dialog-actions">
      @if (showCancel()) {
        <button class="dialog-btn dialog-btn-cancel" (click)="cancel()">{{ cancelText() }}</button>
      }
      <button class="dialog-btn dialog-btn-confirm" (click)="confirm()">{{ confirmText() }}</button>
    </div>
  </div>
</div>
