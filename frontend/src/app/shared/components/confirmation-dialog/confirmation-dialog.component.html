<div class="dialog-overlay" (click)="cancel()">
  <div
    class="dialog-container"
    [class.peligroso]="esPeligroso()"
    (click)="$event.stopPropagation()"
    role="alertdialog"
    aria-modal="true">
    <div class="dialog-icono">
      @if (esPeligroso()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
          <path d="M12 9v4"/><path d="M12 17h.01"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
        </svg>
      }
    </div>

    <h2 class="dialog-title">{{ title() }}</h2>
    <p class="dialog-content">{{ content() }}</p>

    <div class="dialog-actions">
      @if (showCancel()) {
        <button type="button" class="dialog-btn dialog-btn-cancel" (click)="cancel()">
          {{ cancelText() }}
        </button>
      }
      <button
        type="button"
        class="dialog-btn dialog-btn-confirm"
        [class.dialog-btn-peligroso]="esPeligroso()"
        (click)="confirm()">
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
