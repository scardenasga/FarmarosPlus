<nav class="bottom-nav-bar" role="navigation" aria-label="Navegación principal">
  <!-- Indicador Deslizante -->
  <div
    class="nav-indicator"
    [style.transform]="'translateX(' + activeIndex() * 100 + '%)'"
    [style.width.%]="100 / navItems.length"
  >
    <div class="indicator-circle"></div>
  </div>

  @for (item of navItems; track item.link; let i = $index) {
    <a
      [routerLink]="item.link"
      routerLinkActive="active"
      class="nav-item"
      [attr.aria-current]="currentRoute() === item.link ? 'page' : null"
    >
      <div class="icon-container">
        <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path [attr.d]="item.icon" fill="currentColor"/>
        </svg>
      </div>
      <span class="label">{{ item.label }}</span>
    </a>
  }
</nav>
