<div class="toast-contenedor" aria-live="polite">
  @for (n of notificaciones(); track n.id) {
    <div class="toast" [class]="'toast-' + n.tipo" role="status">
      <span class="toast-icono">
        @if (n.tipo === 'exito') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><path d="m8.5 12.5 2.5 2.5 5-5"/>
          </svg>
        } @else if (n.tipo === 'error') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>
          </svg>
        } @else if (n.tipo === 'advertencia') {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
            <path d="M12 9v4"/><path d="M12 17h.01"/>
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
          </svg>
        }
      </span>

      <p class="toast-mensaje">{{ n.mensaje }}</p>

      <button
        type="button"
        class="toast-cerrar"
        (click)="cerrar(n.id)"
        aria-label="Cerrar notificación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
