<div class="inventory-page">
  <div class="sticky-header">
    <app-top-bar
      title="Inventario"
      (back)="handleBack()"
      (alert)="handleAlerts()"
    ></app-top-bar>

    <app-inventory-search
      [activeFilters]="activeFilterCount()"
      (search)="handleSearch($event)"
      (toggleFilter)="toggleFilter()"
    ></app-inventory-search>
  </div>

  <main class="content">
    <app-inventory-summary
      [totalProducts]="filteredProducts().length"
    ></app-inventory-summary>

    <button class="categorias-link" (click)="handleCategorias()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5S15.01 22 17.5 22s4.5-2.01 4.5-4.5S19.99 13 17.5 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5S16.12 15 17.5 15s2.5 1.12 2.5 2.5S18.88 20 17.5 20zM3 21.5h8v-8H3v8zm2-6h4v4H5v-4z" fill="var(--primary)"/>
      </svg>
      <span>Gestionar categorías</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6-6-6z" fill="var(--on-surface-variant)"/>
      </svg>
    </button>

    <app-product-list
      [products]="filteredProducts()"
      (productSelected)="handleProductSelect($event)"
    ></app-product-list>
  </main>

  <app-fab-button
    (clicked)="handleAddProduct()"
  ></app-fab-button>

  <app-inventory-filter
    [isVisible]="isFilterVisible()"
    (close)="toggleFilter()"
    (apply)="handleFilterApply($event)"
  ></app-inventory-filter>
</div>
