<div class="inventory-page">
  <div class="sticky-header">
    <app-top-bar
      title="Inventario"
      [showActions]="true"
      (back)="handleBack()"
      (alert)="handleAlerts()"
      (action)="toggleActions()"
    ></app-top-bar>

    <app-inventory-search
      [activeFilters]="activeFilterCount()"
      (search)="handleSearch($event)"
      (toggleFilter)="toggleFilter()"
    ></app-inventory-search>

    <app-inventory-summary
      [totalProducts]="filteredProducts().length"
      (openSort)="toggleSort()"
    ></app-inventory-summary>

    <app-active-filters
      [filters]="activeFilterChips()"
      (remove)="handleRemoveFilter($event)"
    ></app-active-filters>
  </div>

  <main class="content">
    <app-product-list
      [products]="filteredProducts()"
      (productSelected)="handleProductSelect($event)"
    ></app-product-list>
  </main>

  <app-fab-button
    (clicked)="handleAddProduct()"
  ></app-fab-button>

  <app-inventory-filter
    [isVisible]="isFilterVisible()"
    (close)="toggleFilter()"
    (apply)="handleFilterApply($event)"
  ></app-inventory-filter>

  <app-inventory-sort
    [isVisible]="isSortVisible()"
    [currentField]="sortField()"
    [currentOrder]="sortOrder()"
    (close)="toggleSort()"
    (sort)="handleSortApply($event)"
  ></app-inventory-sort>

  <app-inventory-actions
    [isVisible]="isActionsVisible()"
    (close)="toggleActions()"
    (actionSelected)="handleActionSelection($event)"
  ></app-inventory-actions>
</div>
