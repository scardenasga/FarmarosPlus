<div class="create-page">
  <div class="sticky-header">
    <app-top-bar title="Nuevo Producto" [showAlert]="false" (back)="onCancel()"></app-top-bar>
  </div>

  <main class="content-area">
    <form [formGroup]="productForm">
      
      <!-- Información Básica -->
      <section class="section-card">
        <span class="section-title">Información Básica</span>
        
        <app-form-input 
          label="Nombre del producto" 
          placeholder="Ej. Acetaminofen 500mg" 
          [control]="getControl('nombre')">
        </app-form-input>

        <app-form-input 
          label="Descripción" 
          placeholder="Opcional..." 
          type="textarea"
          [control]="getControl('descripcion')">
        </app-form-input>

        <app-form-input 
          label="Categoría" 
          type="select"
          [options]="categories()"
          placeholder="Seleccione una categoría"
          [control]="getControl('categoriaId')">
        </app-form-input>
      </section>

      <!-- Inventario y Costos -->
      <section class="section-card">
        <span class="section-title">Inventario y Costos</span>
        
        <app-form-input 
          label="Código de Barras" 
          placeholder="Escanea o escribe" 
          [control]="getControl('codigoBarras')"
          [hasIcon]="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </app-form-input>

        <div class="row">
          <app-form-input 
            label="Cantidad Inicial" 
            type="number"
            [control]="getControl('stockInicial')">
          </app-form-input>
          
          <app-form-input 
            label="Costo" 
            type="number"
            suffix="COP"
            [control]="getControl('costo')">
          </app-form-input>
        </div>
      </section>

      <!-- Parámetros de Venta -->
      <section class="section-card">
        <span class="section-title">Parámetros de Venta</span>
        <div class="row">
          <app-form-input
            label="Precio Venta"
            type="number"
            suffix="COP"
            [control]="getControl('precioVenta')">
          </app-form-input>

          <app-form-input
            label="Stock Mínimo"
            type="number"
            [control]="getControl('stockMinimo')">
          </app-form-input>
        </div>
        <app-form-input
          label="IVA (%)"
          type="select"
          [options]="ivaOptions"
          placeholder="Seleccione IVA"
          [control]="getControl('porcentajeIva')">
        </app-form-input>
      </section>

      <!-- Configuración de Lote -->
      <section class="section-card">
        <span class="section-title">Gestión de Lotes</span>
        <div class="form-group-switch">
          <div class="switch-group">
            <label>¿Usar número de lote?</label>
            <label class="switch">
              <input type="checkbox" formControlName="hasLote">
              <span class="slider"></span>
            </label>
          </div>
          @if (productForm.get('hasLote')?.value) {
            <app-form-input 
              label="Número de Lote" 
              placeholder="Ingrese el número de lote" 
              [control]="getControl('numeroLote')">
            </app-form-input>
          }
        </div>
      </section>
    </form>
  </main>

  <footer class="sticky-footer">
    <button type="button" class="btn btn-cancel" (click)="onCancel()">Cancelar</button>
    <button type="button" class="btn btn-save" [disabled]="productForm.invalid" (click)="onSave()">Guardar Producto</button>
  </footer>
</div>

<!-- Confirmation Dialog -->
@if (showConfirmation()) {
  <app-confirmation-dialog
    title="¿Crear Producto?"
    content="Está a punto de crear un nuevo producto con los detalles proporcionados. ¿Desea continuar?"
    cancelText="Revisar"
    confirmText="Crear"
    (onCancel)="cancelCreation()"
    (onConfirm)="confirmCreation()">
  </app-confirmation-dialog>
}
