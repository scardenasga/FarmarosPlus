<section class="summary-container">
  <div class="summary-row">
    <p class="count">
      <span class="highlight">{{ totalProducts }}</span> productos encontrados
    </p>

    <div class="actions">
      <button class="view-btn flex-center" (click)="toggleView.emit()">
        @if (viewMode === 'grid') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h7v7H3V3zm11 0h7v7h-7V3zm0 11h7v7h-7v-7zM3 14h7v7H3v-7z"/></svg>
        } @else if (viewMode === 'lotes') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        }
        <span>{{ viewMode === 'grid' ? 'Ver Lotes' : 'Ver Inventario' }}</span>
      </button>

      <button class="sort-btn flex-center" aria-label="Ordenar" (click)="openSort.emit()">
        <span>Ordenar</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 5.83L15.17 9.17L16.58 7.76L12 3.17L7.41 7.76L8.83 9.17L12 5.83ZM12 18.17L8.83 14.83L7.42 16.24L12 20.83L16.59 16.24L15.17 14.83L12 18.17Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</section>
