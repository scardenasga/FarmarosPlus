<div class="main-container">
  <div class="header-vistas">
    <h1>Notificaciones</h1>
    <p>Seguimiento de pedidos pendientes</p>
  </div>

  <div class="buscador-seccion">
    <app-search-bar 
      (search)="onSearch($event)" 
      [placeholder]="'Buscar por OC o Proveedor...'">
    </app-search-bar>
  </div>

  <div class="lista-alertas">
    <div class="tarjeta-alerta" *ngFor="let item of alertasFiltradas">
      <div class="fila-superior">
        <span class="id-pedido">{{ item.codigoGenerado }}</span>
        <span class="dias-cont" [class.urgente]="item.diasTranscurridos > 5">
          {{ item.diasTranscurridos }} {{ item.diasTranscurridos === 1 ? 'día' : 'días' }} transcurridos
        </span>
      </div>
      
      <div class="fila-medio">
        <span class="proveedor">{{ item.proveedorNombre }}</span>
      </div>

      <!-- Fila inferior solo con la fecha, bien elegante -->
      <div class="fila-inferior">
        <span class="fecha">Registrado: {{ item.fechaCreacionFormateada }}</span>
      </div>
    </div>

    <div *ngIf="alertasFiltradas.length === 0" class="sin-datos">
      <p>No hay pedidos pendientes que coincidan.</p>
    </div>
  </div>

  <app-bottom-nav></app-bottom-nav>
</div>
