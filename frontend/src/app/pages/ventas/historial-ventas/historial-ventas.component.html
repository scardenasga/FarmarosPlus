<div class="container">
  
  <!-- Encabezado -->
  <div class="header">
    
    <span class="titulo">Historial de ventas</span>

    <!-- Componente del Botón de Filtro -->
    <app-boton-filtro (clicFiltro)="irAFiltrar()"></app-boton-filtro>
  </div>

  <!-- Estados de carga y error -->
  <div *ngIf="error" class="error-msg">{{ error }}</div>
  <div *ngIf="cargando && !error" class="error-msg" style="color: white; border-color: gray;">
    Cargando historial...
  </div>

  <!-- Lista de Ventas -->
  <div *ngIf="!cargando && !error" class="contenido-scroll">
    <div class="fecha-grupo" *ngFor="let grupo of ventasAgrupadas">
      <div class="fecha-label">{{ grupo.fecha }}</div>
      <div class="conteo-label">{{ grupo.ventas.length }} resultados</div>

      <div *ngFor="let v of grupo.ventas" class="venta-card" (click)="verDetalle(v.idVenta)">
        <div class="venta-card-top">
          <span class="venta-num">#{{ v.idVenta }}</span>
          <app-estado-venta [estado]="v.estado"></app-estado-venta>
        </div>
        <div class="venta-card-mid">
          <span class="venta-fecha">{{ v.fecha | date:'dd/MM/yyyy' }}</span>
          <span class="venta-vendedor">{{ v.usuario?.nombreCompleto?.split(' ')[0] }}</span>
          <span class="venta-metodo">{{ v.pagos?.[0]?.tipo || 'Efectivo' }}</span>
          <span class="venta-total">${{ v.total | number }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Componente del Botón Nuevo -->
  <app-boton-nuevo-registro [rutaDestino]="'/ventas/buscar'"></app-boton-nuevo-registro>

</div>
