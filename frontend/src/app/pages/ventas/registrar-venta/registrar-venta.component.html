<div class="container">

  <div class="header">
    <button class="btn-back" (click)="cancelar()">←</button>
    <span class="titulo">REGISTRAR VENTA</span>
  </div>

  <div class="ticket-header">
    <span class="ticket-label">Resumen de venta</span>
    <span class="ticket-fecha">{{ hoy | date:'dd/MM/yyyy · HH:mm' }}</span>
  </div>

  <div class="productos-lista">
    <div *ngFor="let p of productos" class="prod-row">
      <div class="prod-nombre">{{ p.nombre }}</div>
      <div class="prod-detalle">
        <span class="lote">LOT</span>
        <div class="qty-ctrl">
          <button (click)="cambiarCantidad(p, -1)">−</button>
          <span>{{ p.cantidad }}</span>
          <button (click)="cambiarCantidad(p, 1)">+</button>
        </div>
        <span class="subtotal-linea">${{ p.precioVenta * p.cantidad | number }}</span>
      </div>
    </div>
  </div>

  <div *ngIf="productos.length === 0" class="vacio">
    <p>No hay productos en la venta</p>
    <button class="btn-buscar" (click)="cancelar()">Ir a buscar productos</button>
  </div>

  <div class="totales" *ngIf="productos.length > 0">
    <div class="tot-row"><span>Subtotal</span><span>${{ subtotal | number }}</span></div>
    <div class="tot-row"><span>Descuento</span><span>$0</span></div>
    <div class="tot-row total"><span>Total</span><span>${{ total | number }}</span></div>
  </div>

  <div class="metodo-pago" *ngIf="productos.length > 0">
    <span class="metodo-label">MÉTODO DE PAGO</span>
    <div class="metodo-btns">
      <button [class.activo]="metodoPago==='EFECTIVO'" (click)="metodoPago='EFECTIVO'">Efectivo</button>
      <button [class.activo]="metodoPago==='TARJETA'" (click)="metodoPago='TARJETA'">Tarjeta</button>
      <button [class.activo]="metodoPago==='MIXTO'" (click)="metodoPago='MIXTO'">Mixto</button>
    </div>
  </div>

  <div class="error-msg" *ngIf="error">{{ error }}</div>

  <div class="acciones" *ngIf="productos.length > 0">
    <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
    <button class="btn-confirmar" (click)="confirmarVenta()" [disabled]="cargando">
      {{ cargando ? 'Registrando...' : 'Confirmar Venta' }}
    </button>
  </div>

</div>
