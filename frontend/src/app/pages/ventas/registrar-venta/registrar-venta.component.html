<div class="container">
  <div class="status-bar"></div>

  
 <div class="header">
    <button class="btn-back-square" (click)="cancelar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 class="titulo-centro">Resumen de venta</h1>
    <button class="btn-notif-square">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
    </button>
  </div>

  <div class="seccion-label">PRODUCTOS ({{ productos.length }})</div>

  <div class="productos-scroll">
    <div *ngFor="let p of productos" class="prod-card-resumen">
      <div class="prod-img-box">
        <img *ngIf="p.imagenUrl" [src]="p.imagenUrl" alt="" />
        <div *ngIf="!p.imagenUrl" class="prod-avatar-resumen">{{ p.nombre?.substring(0,3).toUpperCase() }}</div>
      </div>
      <div class="prod-info-resumen">
        <span class="p-name">{{ p.nombre }}</span>
        <span class="p-price">${{ p.precioVenta | number }}</span>
      </div>
      <div class="prod-derecha">
        <span class="p-qty">{{ p.cantidad }} und.</span>
      </div>
    </div>
  </div>

  
  <div class="totales-card">
    <div class="t-row">
      <span>Subtotal</span>
      <span class="t-val">${{ subtotal | number }}</span>
    </div>
    <div class="t-row row-desc">
      <span>Descuento</span>
      <span class="t-val">- $0</span>
    </div>
    <div class="t-row row-total">
      <span>Total</span>
      <span class="t-val">${{ total | number }}</span>
    </div>
  </div>

 
  <div class="metodo-seccion">
    <span class="metodo-label">MÉTODO DE PAGO</span>
    <div class="metodo-grid">
      <button [class.active]="metodoPago==='EFECTIVO'" (click)="metodoPago='EFECTIVO'">Efectivo</button>
      <button [class.active]="metodoPago==='TARJETA'" (click)="metodoPago='TARJETA'">Tarjeta</button>
      <button [class.active]="metodoPago==='MIXTO'" (click)="metodoPago='MIXTO'">Mixto</button>
    </div>
  </div>

  
 <div class="acciones-finales">
    <button class="btn-cancel" (click)="cancelar()">Cancelar</button>
    <button class="btn-confirm" (click)="confirmarVenta()" [disabled]="cargando">
      {{ cargando ? 'Procesando...' : 'Confirmar Venta' }}
    </button>
  </div>
</div>
