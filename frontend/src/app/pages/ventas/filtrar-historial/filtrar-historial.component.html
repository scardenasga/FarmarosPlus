<div class="container">

  <div class="status-bar"></div>

  <div class="header">
    <button class="btn-back" (click)="volver()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="titulo">Filtrar historial</span>
    <div style="width:24px"></div>
  </div>

  <div class="filtro-grupo">
  <p class="label-titulo">Rango de Fecha</p>
  <div class="rango-fechas-row">
    <app-input-fecha [(fecha)]="fechaInicio"></app-input-fecha>
    <app-input-fecha [(fecha)]="fechaFin"></app-input-fecha>
  </div>
</div>

    <div class="campo-grupo">
      <span class="campo-label">Vendedor</span>
      <input class="input-texto" type="text" [(ngModel)]="vendedor"
             placeholder="Nombre del vendedor" />
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

  </div>

  <div class="acciones">
    <button class="btn-limpiar" (click)="limpiar()">Limpiar Filtros</button>
    <button class="btn-aplicar" (click)="aplicar()" [disabled]="cargando">
      {{ cargando ? 'Buscando...' : 'Aplicar' }}
    </button>
  </div>
