<div class="container">

  <div class="status-bar"></div>

  <div class="header">
    <button class="btn-back" (click)="volver()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <span class="titulo">Filtrar historial</span>
    <div style="width:24px"></div>
  </div>

  <div class="contenido">

    <div class="campo-grupo">
      <span class="campo-label">Rango de Fecha</span>
      <div class="fecha-row">
        <div class="fecha-input">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <input type="date" [(ngModel)]="fechaInicio" />
        </div>
        <div class="fecha-input">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <input type="date" [(ngModel)]="fechaFin" />
        </div>
      </div>
    </div>

    <div class="campo-grupo">
      <span class="campo-label">Vendedor</span>
      <input class="input-texto" type="text" [(ngModel)]="vendedor"
             placeholder="Nombre del vendedor" />
    </div>

    <div class="error-msg" *ngIf="error">{{ error }}</div>

  </div>

  <div class="acciones">
    <button class="btn-limpiar" (click)="limpiar()">Limpiar Filtros</button>
    <button class="btn-aplicar" (click)="aplicar()" [disabled]="cargando">
      {{ cargando ? 'Buscando...' : 'Aplicar' }}
    </button>
  </div>

</div>
