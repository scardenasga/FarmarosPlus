<div class="container">

  <div class="header">
    <span class="titulo">Devoluciones</span>
    <a class="link-compras" routerLink="/entregas/compras">Ver compras</a>
  </div>

  <div *ngIf="error" class="msg-error">{{ error }}</div>
  <div *ngIf="cargando && !error" class="msg-info">Cargando historial...</div>

  <div *ngIf="!cargando && !error && devoluciones.length === 0" class="msg-vacio">
    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"
         fill="none" stroke="#90f4d3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
    </svg>
    <p>Sin devoluciones registradas</p>
  </div>

  <div *ngIf="!cargando && !error" class="contenido-scroll">
    <div *ngFor="let dev of devoluciones" class="dev-card">
      <div class="dev-top">
        <span class="dev-proveedor">{{ dev.nombreProveedor }}</span>
        <span class="dev-fecha">{{ dev.fecha | date:'dd/MM/yyyy' }}</span>
      </div>
      <div class="dev-mid">
        <span class="dev-usuario">{{ dev.usuarioResponsable }}</span>
        <span class="dev-items">{{ totalProductos(dev) }} unid. devueltas</span>
      </div>
      <div *ngIf="dev.motivo" class="dev-motivo">{{ dev.motivo }}</div>
      <div class="dev-detalles">
        <span *ngFor="let d of dev.detalles" class="chip-producto">
          {{ d.nombreProducto }} × {{ d.cantidad }}
        </span>
      </div>
    </div>
  </div>

  <button class="btn-flotante-accion" (click)="nueva()">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
         fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

</div>
