<div class="dashboard-page">
  <div class="sticky-header">
    <app-top-bar 
      title="Gestión de Compras" 
      [showAlert]="true" 
      (back)="handleBack()"
      (alert)="handleAlerts()">
    </app-top-bar>
  </div>

  <main class="content-area">
    <div class="cards-layout">
      @for (card of cards(); track card.title) {
        <div class="card-wrapper" [style.--delay]="$index * 0.1 + 's'">
          <article class="premium-card" (click)="navigateTo(card.link)">
            <div class="card-accent" [style.background-color]="card.color"></div>
            
            <div class="card-header">
              <span class="tag">{{ card.tag }}</span>
              <div class="icon-box" [style.background-color]="card.iconBg">
                <span class="icon">{{ card.icon }}</span>
              </div>
            </div>

            <div class="card-body">
              <h2 class="title">{{ card.title }}</h2>
              <p class="description">{{ card.description }}</p>
            </div>

            <div class="card-footer">
              <span>Gestionar</span>
              <svg class="arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
          </article>
        </div>
      }
    </div>
  </main>
</div>
