# Perfil PROD: usado al ejecutar el JAR empaquetado para cliente.
# La DB vive fuera del proyecto para que no se borre al actualizar.
# Windows: C:\Users\TuUsuario\.farmarosplus\farmarosplus.db
spring.datasource.url=jdbc:sqlite:${user.home}/.farmarosplus/farmarosplus.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
