spring.application.name=backend

# --- Base de datos ---
# La DB se guarda en la carpeta personal del usuario. Asi no se borra al actualizar.
# Windows: C:\Users\TuUsuario\.farmarosplus\farmarosplus.db
spring.datasource.url=jdbc:sqlite:${user.home}/.farmarosplus/farmarosplus.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- Arranque rapido ---
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# Configuracion de Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Recomendaciones FP-Growth (SMILE 6.3.0)
farmaros.recomendaciones.min-support-relativo=0.10
farmaros.recomendaciones.min-confidence=0.50
farmaros.recomendaciones.min-lift=1.0
farmaros.recomendaciones.cache-ttl-minutes=60
farmaros.recomendaciones.excluir-prescripcion=true
farmaros.recomendaciones.limite-maximo=5

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
