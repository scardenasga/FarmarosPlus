spring.application.name=backend

# --- Base de datos (DEFAULT = PROD) ---
# Por defecto el JAR usa la DB de produccion en el home del usuario.
# Para desarrollo (IDE / ./mvnw spring-boot:run) activa el perfil 'dev':
#   - via plugin (ya configurado en pom.xml -> jvmArguments -Dspring.profiles.active=dev)
#   - o en IntelliJ: Run Configuration -> Active profiles: dev
#   - o CLI: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# El perfil dev sobrescribe esta URL con database/farmarosplus.db (ver application-dev.properties).
# No edites esta URL para desarrollo; usa el perfil dev.
spring.datasource.url=jdbc:sqlite:${user.home}/.farmarosplus/farmarosplus.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# --- Arranque rapido ---
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false

# Configuracion de Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

# Recomendaciones FP-Growth (SMILE 6.3.0)
farmaros.recomendaciones.min-support-relativo=0.10
farmaros.recomendaciones.min-confidence=0.50
farmaros.recomendaciones.min-lift=1.0
farmaros.recomendaciones.cache-ttl-minutes=60
farmaros.recomendaciones.excluir-prescripcion=true
farmaros.recomendaciones.limite-maximo=5

# Ganancia mínima por defecto sobre costo (usada al crear producto sin precioVenta)
farmaros.ganancia.min-porcentaje=30.0

# Producto imagen (SQLite TEXT + filesystem)
# PROD: en el home del usuario para que no se borren al actualizar
farmaros.producto.imagenes.dir=${user.home}/.farmarosplus/uploads/productos
farmaros.proveedor.imagenes.dir=${user.home}/.farmarosplus/uploads/proveedores
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
