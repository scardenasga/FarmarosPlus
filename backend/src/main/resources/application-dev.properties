# Perfil DEV: usado al ejecutar desde IDE (IntelliJ) o con ./mvnw spring-boot:run
# Usa la base de datos versionada en el proyecto, no la del usuario.
# Ruta relativa a la RAIZ del proyecto (FarmarosPlus/). Tanto mvn (workingDirectory=..)
# como IntelliJ (Working Directory = FarmarosPlus) deben apuntar a la raiz.
# DevDatabasePathProcessor hace fallback a ../database/ si el IDE usa backend/ como WD.
spring.datasource.url=jdbc:sqlite:database/farmarosplus.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# En DEV no se recrea la DB; solo se actualiza esquema si falta alguna tabla/column nueva.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
# Permite lazy loading en la vista para no romper con open-in-view=false de prod (evita CANTOPEN y 500 en /activos y /recepciones)
spring.jpa.open-in-view=true

# En DEV las imagenes quedan en el proyecto (uploads/productos) para verlas facil
farmaros.producto.imagenes.dir=uploads/productos
farmaros.proveedor.imagenes.dir=uploads/proveedores
